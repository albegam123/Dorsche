[package]
name = "dorsche"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0"
cxx = "1.0"
memmap2 = "0.9"
tokio = { version = "1.47", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[build-dependencies]
cxx-build = "1.0"
