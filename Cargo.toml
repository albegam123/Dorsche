[package]
name = "dorsche"
version = "0.1.0"
edition = "2024"
build = "build.rs"
default-run = "dorsche"

[features]
default = []
pipewire = ["dep:pipewire"]

[[bin]]
name = "dorsche_pipewire"
path = "src/bin/dorsche_pipewire.rs"
required-features = ["pipewire"]

[dependencies]
anyhow = "1.0"
cxx = "1.0"
libc = "0.2"
memmap2 = "0.9"
pipewire = { version = "0.10.1", optional = true, features = ["v1_0_0"] }
tokio = { version = "1.47", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[build-dependencies]
cxx-build = "1.0"
