[Service]
# Upstream Floss creates its UIPC sockets before changing them to the
# bluetooth-audio group. Membership is sufficient for that chown(2), so keep
# CAP_CHOWN out of the daemon's deliberately narrow capability bounding set.
SupplementaryGroups=bluetooth-audio

# btmanagerd starts instances as <virtual_hci>_<real_hci>. The virtual index is
# the stable D-Bus identity; the real index is the current kernel hciN. The
# upstream Debian unit predates this pairing and incorrectly passes all of %i
# as --hci, so replace only its process boundary.
ExecStart=
ExecStart=/usr/libexec/bluetooth/dorsche-btadapterd-launch %i

# btadapterd creates /var/run/bluetooth/bluetooth<virtual>.pid only after the
# stack is ready. btmanagerd consumes that edge to complete TurningOn. Do not
# delete it in ExecStartPost; btadapterd removes it during a clean shutdown and
# btmanagerd has stale-process recovery for crashes.
ExecStartPost=
