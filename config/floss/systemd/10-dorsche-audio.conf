[Service]
# Upstream Floss creates its UIPC sockets before changing them to the
# bluetooth-audio group. Membership is sufficient for that chown(2), so keep
# CAP_CHOWN out of the daemon's deliberately narrow capability bounding set.
SupplementaryGroups=bluetooth-audio
# Resolve only known USB-controller HFP transport pairs before Floss reads its
# sysprops. Unknown/non-USB controllers are reported and left unchanged. The
# '+' grants full credentials only to this short pre-start helper so its atomic
# replacement can preserve root:bluetooth ownership; btadapterd itself retains
# the upstream narrow capability bounding set without CAP_CHOWN.
ExecStartPre=+/usr/libexec/bluetooth/dorsche-controller-quirks --hci %i --apply
