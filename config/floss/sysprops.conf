# Standard Linux HCI controllers do not necessarily implement Android's
# LE_GET_VENDOR_CAPABILITIES (OCF 0x153). Controllers with that extension may
# opt back in explicitly after their firmware has been verified.
[Sysprops]
bluetooth.core.le.vendor_capabilities.enabled=false
# Enable only on Linux 6.18+ after confirming HCI_DRV_PKT support.
bluetooth.hfp.linux_hci_driver_altsetting.enabled=false
